[project]
name = "duplex-bot"
version = "0.1.0"
description = "Full-duplex voice agent with cascaded STT → LLM → TTS architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "azure-cognitiveservices-speech>=1.40.0",
    "elevenlabs>=1.9.0",
    "langfuse>=2.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
