<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplex Bot — Voice Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #fff; }
        .status {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 2rem;
        }
        .status.connected { color: #4caf50; }
        .status.error { color: #f44336; }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        button {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #connectBtn { background: #2196f3; color: #fff; }
        #connectBtn:hover:not(:disabled) { background: #1976d2; }
        #disconnectBtn { background: #f44336; color: #fff; }
        #disconnectBtn:hover:not(:disabled) { background: #d32f2f; }

        .indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 3px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            transition: all 0.3s;
        }
        .indicator.listening {
            border-color: #4caf50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.3);
        }
        .indicator.speaking {
            border-color: #2196f3;
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.3);
        }
        .indicator-text { font-size: 0.8rem; color: #666; }

        .transcript-area {
            width: 100%;
            max-width: 600px;
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #111;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .message {
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .message.user { background: #1a2a1a; border-left: 3px solid #4caf50; }
        .message.agent { background: #1a1a2a; border-left: 3px solid #2196f3; }
        .message.system { background: #1a1a1a; border-left: 3px solid #666; color: #888; font-size: 0.8rem; }

        .config {
            width: 100%;
            max-width: 600px;
            margin-bottom: 1rem;
        }
        .config input, .config select {
            width: 100%;
            padding: 0.5rem;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        .config label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <h1>Duplex Bot</h1>
    <div class="config">
        <label>WebSocket URL</label>
        <input type="text" id="wsUrl" value="ws://localhost:8000/ws/browser" />
    </div>
    <div class="config">
        <label>Microphone</label>
        <select id="micSelect"><option value="">Loading devices...</option></select>
    </div>
    <div id="status" class="status">Disconnected</div>
    <div class="controls">
        <button id="connectBtn" onclick="connect()">Connect</button>
        <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    </div>
    <div id="indicator" class="indicator">
        <span class="indicator-text">Idle</span>
    </div>
    <div id="transcripts" class="transcript-area"></div>

    <script>
    const SAMPLE_RATE = 16000;
    const CHUNK_MS = 32;
    const SAMPLES_PER_CHUNK = SAMPLE_RATE * CHUNK_MS / 1000; // 512

    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let playbackQueue = [];
    let isPlaying = false;
    let currentSource = null;

    async function enumerateMics() {
        // Request permission first so device labels are available
        try {
            const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            tempStream.getTracks().forEach(t => t.stop());
        } catch (e) {
            // Permission denied — dropdown will show ids only
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');
        const select = document.getElementById('micSelect');
        select.innerHTML = '';
        mics.forEach((mic, i) => {
            const opt = document.createElement('option');
            opt.value = mic.deviceId;
            opt.textContent = mic.label || ('Microphone ' + (i + 1));
            select.appendChild(opt);
        });
    }

    // Refresh list when devices change (plug/unplug)
    navigator.mediaDevices.addEventListener('devicechange', enumerateMics);
    enumerateMics();

    function setStatus(text, cls = '') {
        const el = document.getElementById('status');
        el.textContent = text;
        el.className = 'status ' + cls;
    }

    function setIndicator(state) {
        const el = document.getElementById('indicator');
        el.className = 'indicator ' + state;
        el.querySelector('.indicator-text').textContent =
            state === 'listening' ? 'Listening' :
            state === 'speaking' ? 'Speaking' : 'Idle';
    }

    function addMessage(text, type) {
        const el = document.getElementById('transcripts');
        const msg = document.createElement('div');
        msg.className = 'message ' + type;
        msg.textContent = (type === 'user' ? 'You: ' : type === 'agent' ? 'Agent: ' : '') + text;
        el.appendChild(msg);
        el.scrollTop = el.scrollHeight;
    }

    async function connect() {
        const url = document.getElementById('wsUrl').value;
        const selectedDeviceId = document.getElementById('micSelect').value;
        try {
            // Get microphone access using selected device
            const audioConstraints = {
                sampleRate: SAMPLE_RATE,
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true,
            };
            if (selectedDeviceId) {
                audioConstraints.deviceId = { exact: selectedDeviceId };
            }
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: audioConstraints,
            });

            audioContext = new AudioContext({ sampleRate: SAMPLE_RATE });
            const source = audioContext.createMediaStreamSource(mediaStream);

            // ScriptProcessorNode for capturing audio
            // Buffer size must be a power of two; 1024 is the nearest valid size
            scriptProcessor = audioContext.createScriptProcessor(1024, 1, 1);

            // Connect WebSocket
            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                setStatus('Connected', 'connected');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                addMessage('Connected to voice agent', 'system');

                // Send start message
                ws.send(JSON.stringify({ type: 'start', session_id: crypto.randomUUID() }));

                // Start capturing audio
                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);
                setIndicator('listening');

                // Re-enumerate mics now that we have an active stream (labels available)
                enumerateMics();
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    // Audio data from agent
                    handleAudioResponse(event.data);
                } else {
                    // Control message
                    try {
                        const msg = JSON.parse(event.data);
                        handleControlMessage(msg);
                    } catch (e) {
                        console.warn('Invalid message:', event.data);
                    }
                }
            };

            ws.onclose = () => {
                setStatus('Disconnected');
                cleanup();
            };

            ws.onerror = (err) => {
                setStatus('Connection error', 'error');
                console.error('WebSocket error:', err);
            };

            // Capture microphone audio and send to server
            scriptProcessor.onaudioprocess = (event) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const inputData = event.inputBuffer.getChannelData(0);
                // Convert float32 to int16
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    const s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                ws.send(pcm16.buffer);
            };

        } catch (err) {
            setStatus('Error: ' + err.message, 'error');
            console.error('Connection error:', err);
        }
    }

    function handleAudioResponse(arrayBuffer) {
        setIndicator('speaking');
        playbackQueue.push(arrayBuffer);
        if (!isPlaying) {
            playNextChunk();
        }
    }

    function playNextChunk() {
        if (playbackQueue.length === 0) {
            isPlaying = false;
            currentSource = null;
            setIndicator('listening');
            return;
        }

        isPlaying = true;
        const data = playbackQueue.shift();
        const int16 = new Int16Array(data);
        const float32 = new Float32Array(int16.length);
        for (let i = 0; i < int16.length; i++) {
            float32[i] = int16[i] / 0x8000;
        }

        const buffer = audioContext.createBuffer(1, float32.length, SAMPLE_RATE);
        buffer.getChannelData(0).set(float32);

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.onended = playNextChunk;
        source.start();
        currentSource = source;
    }

    function handleControlMessage(msg) {
        switch (msg.type) {
            case 'clear':
                // Barge-in: stop playback immediately
                playbackQueue = [];
                isPlaying = false;
                if (currentSource) {
                    currentSource.onended = null;  // Prevent chaining
                    try { currentSource.stop(); } catch (e) {}
                    currentSource = null;
                }
                setIndicator('listening');
                console.log('Barge-in: playback cleared');
                break;
            case 'transcript':
                addMessage(msg.text, 'user');
                break;
            case 'agent_text':
                addMessage(msg.text, 'agent');
                break;
            default:
                console.log('Control:', msg);
        }
    }

    function disconnect() {
        if (ws) {
            ws.send(JSON.stringify({ type: 'stop' }));
            ws.close();
        }
        cleanup();
        addMessage('Disconnected', 'system');
    }

    function cleanup() {
        if (scriptProcessor) {
            scriptProcessor.disconnect();
            scriptProcessor = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }
        if (audioContext) {
            audioContext.close();
            audioContext = null;
        }
        ws = null;
        playbackQueue = [];
        isPlaying = false;
        if (currentSource) {
            currentSource.onended = null;
            try { currentSource.stop(); } catch (e) {}
            currentSource = null;
        }
        setIndicator('');
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
    }
    </script>
</body>
</html>
